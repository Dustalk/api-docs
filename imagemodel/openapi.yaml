# ImageModel（画像認識モデル）の API 契約。手動管理。
# 本体: ../../../../ImageModel/image-model（FastAPI / AWS App Runner）。
# v2 の決定の経緯は ImageModel の docs/api-v2.md と docs/todo.md。
openapi: 3.0.3
info:
  title: ImageModel API（写真からの品目判定）
  version: 2.1.0
  description: |
    写真から粗大ごみの品目候補を出す REST API。**Dustalk の家庭系依頼**から使う。

    ⚠ **v2.0.0 は実装中の契約。** 今動いているサーバは v1.3.0 の形（`mode` / `attributes` /
    `additional` など）を返す。v2 の実装が済むまでは、この文書が「これから返す形」を表す。

    ## 呼び出しの流れ

    1. **判定** `POST /api/detect`：写真1枚を送ると、品目マスタにある品目の候補と、
       写真上の位置（bbox）が返る。ImageModel が判定の番号 `analysisId` を発行する
    2. **撮り直し** `POST /api/detect/{analysisId}/retake`：`retakeSuggestions` で
       追加撮影を頼まれたら、追加写真だけを送る。主写真は ImageModel が持っている。
       新しい `analysisId` が返るので、前の結果は丸ごと置き換える
    3. **確定結果の通知** `POST /api/feedback`：依頼を**送信したとき**に、最後の
       `analysisId` と、利用者が確定した品目の一覧を送る（下書きの保存時には送らない）

    Dustalk の依頼1件に、判定がいくつも付くことがある（写真ごと、撮り直しごと）。
    Dustalk は返ってきた `analysisId` を写真と一緒に保存しておく。

    ## 品目の返し方

    - `itemId` は**必ず品目マスタにある品目**（サーバ側で検証する）。リストにない物は
      「その他(上記にないもの)」で返し、`detectedName` に何だったかを入れる
    - 写っている物は**面積にかかわらず全部返す**。どれを依頼に入れるかは利用者が選ぶ。
      面積が要るときは `bbox.width * bbox.height` で出せる
    - 大・小のある品目（ソファ(大)/(小) など）は、推定した寸法としきい値で決める。
      写真から決められないとき（冷蔵庫の容量など）は `sizeOptions` に候補を並べる
    - `wardCode` を渡すと、その自治体の品目リストがあればそれを使う。なければ共通のリスト。
      どちらを使ったかは `listSource` に入る
    - 家電の型番・メーカー・年式の読み取りは**この API では行わない**（別の API で出す予定）

    ## 運用上の前提

    | | |
    |---|---|
    | 待ち時間（2026-10-29 実測、50枚） | 中央値 6.0 秒 / 10回のうち9回が 10.2 秒以内 |
    | タイムアウト予算 | リクエスト全体 45 秒。使い切ると 503（`retryable: true`） |
    | 入力 | 1 枚 10MB。追加写真は合計 3 枚まで |
    | 形式 | image/jpeg, image/png, image/webp |
    | `analysisId` の期限 | 30 日（案・未確定）。過ぎると撮り直しと確定結果の通知を受け付けない |

    **クライアント側のタイムアウトは 45 秒より長く取ること。** 短いと、サーバが
    まだ処理中なのに切れて二重送信になる。エラーの `retryable` を見て再送の可否を決める。

    **bbox の座標系は EXIF orientation 適用後**（＝ブラウザが表示する向き）の画像に対する %。
    撮影された元ファイルをそのまま `<img>` に描き、% を CSS に当てればよい。

    ## 送られた写真と結果の扱い

    写真・判定の結果・確定した品目は ImageModel 側（AWS）に保存し、AI の判定が正しかったかを
    測ることと、判定の改善に使う。保存期間と同意の文言は atlas #580 で相談中。

servers:
  - url: https://tygdhqm9pf.ap-northeast-1.awsapprunner.com
    description: 開発環境（AWS App Runner, ap-northeast-1）

security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      summary: ヘルスチェック
      description: Gemini は呼ばない。App Runner のヘルスチェックはここへ向ける。
      operationId: health
      security: []
      responses:
        "200":
          description: 稼働中
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]

  /api/detect:
    post:
      summary: 写真から品目を判定する
      operationId: detect
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 判定する写真。image/jpeg, image/png, image/webp。最大 10MB。
                wardCode:
                  type: string
                  description: |
                    依頼先の自治体コード（`ward_master.code`）。その自治体の品目リストがあれば
                    それを使い、なければ共通のリストを使う。指定しなければ共通のリスト。
                    ⚠ 存在しないコードのときにエラーにするか共通のリストに倒すかは未確定（案はエラー）。
                dustalkRequestId:
                  type: string
                  description: |
                    Dustalk の依頼の内部 ID（任意）。記録だけして、あとで回収の実績と
                    突き合わせるために使う。判定の結果には影響しない。
      responses:
        "200":
          description: 判定成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectResponse"
              examples:
                living:
                  summary: ソファ・冷蔵庫・傘が写った写真
                  value:
                    analysisId: an_8f3c2e7b9d1a4c6e
                    masterVersion: "2026-10-29T12:00:00Z#ab12cd34"
                    listSource: common
                    items:
                      - id: 0
                        itemId: 1f0c6a2e-0000-4000-8000-000000000001
                        itemName: ソファ(大)
                        detectedName: 3人掛けソファ
                        bbox: { x: 12.5, y: 30.0, width: 60.2, height: 45.1 }
                        sizeOptions: null
                      - id: 1
                        itemId: 1f0c6a2e-0000-4000-8000-000000000021
                        itemName: 冷蔵庫(大)
                        detectedName: 2ドア冷蔵庫
                        bbox: { x: 75.0, y: 10.0, width: 20.0, height: 70.0 }
                        sizeOptions:
                          - itemId: 1f0c6a2e-0000-4000-8000-000000000020
                            itemName: 冷蔵庫(小)
                          - itemId: 1f0c6a2e-0000-4000-8000-000000000021
                            itemName: 冷蔵庫(大)
                      - id: 2
                        itemId: 1f0c6a2e-0000-4000-8000-000000000099
                        itemName: その他(上記にないもの)
                        detectedName: 傘
                        bbox: { x: 5.0, y: 50.0, width: 6.0, height: 30.0 }
                        sizeOptions: null
                    retakeSuggestions:
                      - id: 1
                        region: { x: 70.0, y: 5.0, width: 28.0, height: 80.0 }
                        reason: 冷蔵庫の側面しか見えず、大きさを判断しづらい
                        instruction: 冷蔵庫の正面から全体が入るように撮影してください
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"

  /api/detect/{analysisId}/retake:
    post:
      summary: 追加写真を足して判定し直す
      description: |
        `retakeSuggestions` で頼まれた箇所を撮った写真を1枚送る。サーバは、その判定の主写真と
        それまでの追加写真に、この写真を足して判定し直す。追加写真は合計 3 枚まで。

        **新しい `analysisId` が返る。** 前の結果は直したものではなく丸ごと置き換えること
        （品目の分け方が変わることがある。`id` も振り直し）。bbox は主写真に対する % のまま。
        撮り直せるのは**最新の判定だけ**（古い `analysisId` から撮り直すと 409）。
      operationId: retake
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 追加写真1枚。image/jpeg, image/png, image/webp。最大 10MB。
      responses:
        "200":
          description: 判定成功（新しい analysisId）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AnalysisNotFound"
        "409":
          $ref: "#/components/responses/AnalysisConflict"
        "410":
          $ref: "#/components/responses/AnalysisExpired"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"

  /api/feedback:
    post:
      summary: 利用者が確定した品目を知らせる
      description: |
        依頼を**送信したとき**に、判定の連鎖ごとに送る（下書きの保存時には送らない）。
        `analysisId` は最後の判定（撮り直したなら撮り直し後）を指す。

        AI の候補と確定した品目を比べて、判定の精度を測り、改善に使う。
        候補ごとの「採用・外した・変えた」は送らなくてよい（ImageModel 側で集合として比べる）。

        同じ `analysisId` に2回送られたら、後から来たもので上書きする（履歴は残す）。
        通信の再送や、送信後の編集はそのまま送り直してよい。
      operationId: feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
            example:
              analysisId: an_8f3c2e7b9d1a4c6e
              dustalkRequestId: 6b2f0d1e-5a3c-4e7f-9b8a-1c2d3e4f5a6b
              items:
                - itemId: 1f0c6a2e-0000-4000-8000-000000000002
                  quantity: 4
                - itemId: 1f0c6a2e-0000-4000-8000-000000000020
      responses:
        "204":
          description: 受け付けた
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AnalysisNotFound"
        "410":
          $ref: "#/components/responses/AnalysisExpired"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Dustalk backend にだけ渡すキー。ブラウザから直接は呼ばない。

  parameters:
    AnalysisId:
      name: analysisId
      in: path
      required: true
      description: 判定の番号（`POST /api/detect` などが返したもの）。
      schema:
        type: string

  schemas:
    DetectResponse:
      type: object
      required: [analysisId, masterVersion, listSource, items, retakeSuggestions]
      properties:
        analysisId:
          type: string
          description: ImageModel が判定ごとに発行する番号。撮り直しと確定結果の通知で使う。
        masterVersion:
          type: string
          description: 判定に使った品目マスタの版。どの版で判定したかを後から追うために返す。
        listSource:
          type: string
          enum: [ward, common]
          description: "`ward` = 自治体の品目リスト / `common` = 共通の品目リスト"
        items:
          type: array
          description: 写っている物の候補。面積にかかわらず全部返す。
          items:
            $ref: "#/components/schemas/DetectedItem"
        retakeSuggestions:
          type: array
          description: 判定を確定しづらい箇所の追加撮影のお願い。最大 3 件。確実なら空配列。
          maxItems: 3
          items:
            $ref: "#/components/schemas/RetakeSuggestion"

    DetectedItem:
      type: object
      required: [id, itemId, itemName, detectedName, bbox, sizeOptions]
      properties:
        id:
          type: integer
          description: このレスポンスの中での番号。撮り直すと振り直される。
        itemId:
          type: string
          description: 品目マスタ（`household_waste_item_master.id`）の id。必ずリストにある品目。
        itemName:
          type: string
          description: 品目マスタの品目名（例 "ソファ(大)"、"その他(上記にないもの)"）。
        detectedName:
          type: string
          description: |
            AI が付けた物の名前（例 "3人掛けソファ"、"傘"）。
            「その他」のときに何だったかを示す。
        bbox:
          $ref: "#/components/schemas/BBox"
        sizeOptions:
          type: array
          nullable: true
          description: |
            大・小を写真から決められなかったときだけ、選べる品目を並べる（それ以外は null）。
            `itemId` には AI が選んだ方が入っている。画面で利用者に選んでもらう。
          items:
            $ref: "#/components/schemas/ItemRef"

    ItemRef:
      type: object
      required: [itemId, itemName]
      properties:
        itemId:
          type: string
        itemName:
          type: string

    BBox:
      type: object
      description: 表示向きの画像（EXIF orientation 適用後）に対する % 座標（0〜100）。
      required: [x, y, width, height]
      properties:
        x:
          type: number
          description: 左上の X（画像の幅に対する %）
        y:
          type: number
          description: 左上の Y（画像の高さに対する %）
        width:
          type: number
          description: 幅（%）
        height:
          type: number
          description: 高さ（%）

    RetakeSuggestion:
      type: object
      required: [id, region, instruction]
      properties:
        id:
          type: integer
          description: 1 始まりの通し番号。
        region:
          $ref: "#/components/schemas/BBox"
        reason:
          type: string
          description: その箇所を確定しづらい理由（1 文）。
        instruction:
          type: string
          description: 利用者へ向けた撮影の指示。そのまま画面に出せる。

    FeedbackRequest:
      type: object
      required: [analysisId, items]
      properties:
        analysisId:
          type: string
          description: 最後の判定の番号。
        dustalkRequestId:
          type: string
          description: Dustalk の依頼の内部 ID（任意）。
        items:
          type: array
          description: |
            利用者が最終的に確定した品目。AI の候補に無かった物を足した場合も含める。
            Dustalk の下書き（`selected_products`）と同じく、品目ごとに数量を持つ。
          items:
            type: object
            required: [itemId]
            properties:
              itemId:
                type: string
              quantity:
                type: integer
                minimum: 1
                default: 1
                description: 確定した数量。省略したら 1。

    Error:
      type: object
      required: [detail, code, retryable]
      properties:
        detail:
          type: string
          description: 人が読める説明。
        code:
          type: string
          description: 機械で判定するためのコード。
          enum:
            - invalid_image
            - invalid_request
            - unknown_ward
            - too_many_photos
            - unauthorized
            - analysis_not_found
            - analysis_expired
            - analysis_superseded
            - analysis_finalized
            - upstream_unavailable
        retryable:
          type: boolean
          description: 同じリクエストを再送してよいか。

  responses:
    BadRequest:
      description: |
        入力の誤り。`invalid_image`（非対応の形式・サイズ超過）、`invalid_request`
        （必須項目の欠け・JSON の形の誤り）、`unknown_ward`、`too_many_photos`
        （追加写真が合計 3 枚を超えた）。再送しても同じ。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: 1 枚 10MB までです
            code: invalid_image
            retryable: false
    Unauthorized:
      description: API キーがない・違う。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: API キーが必要です
            code: unauthorized
            retryable: false
    AnalysisNotFound:
      description: その `analysisId` が存在しない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: 判定が見つかりません
            code: analysis_not_found
            retryable: false
    AnalysisExpired:
      description: |
        `analysisId` の期限が切れている。撮り直しはできないので、最初から判定し直す。
        確定結果の通知が期限切れになっても、Dustalk の依頼には影響しない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: 判定の期限が切れています
            code: analysis_expired
            retryable: false
    AnalysisConflict:
      description: |
        `analysis_superseded`：最新の判定ではない（すでに撮り直し済み）。最新の `analysisId` を使う。
        `analysis_finalized`：確定結果を受け取ったあとなので撮り直せない。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: この判定はすでに撮り直されています
            code: analysis_superseded
            retryable: false
    UpstreamUnavailable:
      description: |
        AI（Gemini）の失敗・タイムアウト。少し待って再送してよい。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: 判定が一時的にできません。しばらく待ってから再試行してください。
            code: upstream_unavailable
            retryable: true
