# GIS（回収可否判定）の API 契約。手動管理。
# 本体: Dustalk/gis（web/ = Next.js / AWS App Runner、判定 = AWS Lambda）。
# Dustalk 本体のサーバが依頼時に判定を起こし、回収業者の画面が iframe で結果を出す。
openapi: 3.0.3
info:
  title: GIS API（現場の回収可否判定）
  version: 2.0.0
  description: |
    住所の現場に、どの大きさの回収車（軽・2t・4t）が乗り付けられるかを判定する。
    前面道路の幅員と進入経路を、国土地理院・PLATEAU・OpenStreetMap のデータから測る。

    ## Dustalk 本体との連携

    照合の鍵は **本体の現場 ID（`emission_site.id`、uuid）だけ**。

    1. **依頼者が依頼を出したとき**、本体のサーバが現場 ID と住所を `POST /api/sites`
       に送る。判定が裏で走り始める（100 秒前後）。**返事は読まなくてよい。**
    2. **回収業者が見るとき**、同じ現場 ID で `GET /embed/{siteId}` を iframe で開く。
       現場の詳細だけが出る（一覧などには出ていかない）。まだ判定中なら
       「判定中」を出し、終わり次第切り替わる。
    3. **判定が回りきらなかったとき**は、業者にはお詫びだけを出す。再試行のボタンも
       自動の再判定も無い。やり直すには本体が同じ依頼を送り直す。

    `/embed` では判定を起こさない。`POST /api/sites` を呼べなかった現場は、
    業者が開いてもお詫びになる。判定の完了を本体に知らせることはしない。

    ## 住所と座標

    本体は**入力どおりの住所**を送ればよい（`prefecture` + `city_address`。建物名が
    付いていても構わない）。正規化は要らない。GIS が住所の正規化 Lambda
    （デジタル庁の abr-geocoder、Dustalk/gis の `geocoder/`）で表記の揺れを揃え、
    ABR（アドレス・ベース・レジストリ）の座標を引く。

    - 号（住居表示）か地番まで解け、座標もその精度のときだけ判定する。
    - 番号や町名の打ち間違い・番地の書き忘れは解けないので、判定せずお詫びになる。
      入力の時点で警告して直してもらうのは本体の依頼画面の役目（別件）。
    - Google Geocoding には回さない。対応範囲の5県では番地まで解けないことが多く
      （2026-10 の試験で 65/100）、別の町を指すこともあったため。

    ## 判定は現場につき1回

    同じ依頼を何度送っても、判定中に `/embed` を開いても、判定は二重に走らない。
    失敗した判定と、15 分以上止まった判定だけは、依頼を送り直せばやり直す。
    同じ `site_id` を別の住所で送ると、新しい住所で判定し直す（URL は変わらない）。

    ## 対応範囲

    判定できるのは、地図データを取り込んだ地域だけ（2026-09 時点で青森県・岩手県・
    秋田県・山形県・福岡県の全域）。範囲外は `POST /api/sites` が 422 `unsupported` を返す。

    ## 現在の状態

    - `site_id` 付きの `POST /api/sites` は Bearer トークンが必須
    - GIS の画面の Basic 認証は本番で無効
    - `/embed` は Basic 認証の対象外。埋め込みを許す親オリジンは GIS 側の
      `GIS_EMBED_ORIGINS` で絞る（`Content-Security-Policy: frame-ancestors`）。
      **これはアクセス制御ではない**（URL を直接開けば見える）
    - 実証中。画面には「テスト中」と出典（PLATEAU は CC BY 4.0）が出る

    実装と詳しい経緯は Dustalk/gis の README「他システムへの埋め込み」。

servers:
  - url: https://{host}
    description: App Runner の URL（Terraform の `terraform output web_url`）。本体では環境変数に持たせ、直書きしない
    variables:
      host:
        default: xxxxxxxx.ap-northeast-1.awsapprunner.com

tags:
  - name: judge
    description: 判定の依頼（サーバから）
  - name: pages
    description: 画面（iframe・リンク）

paths:
  /api/sites:
    post:
      tags: [judge]
      operationId: requestJudge
      summary: 現場の判定を依頼する
      description: |
        判定を起こして即座に返る（判定そのものは Lambda で非同期に走る）。
        台帳にあれば判定は起こさず `done` を返す。住所から座標を引くのは GIS 側。

        GIS の画面（現場の追加）も同じエンドポイントを使う（`site_id` の代わりに
        座標付きの `components` を送る。本体からは送らなくてよい）。

        **返事は読まなくてよい。** 読むなら意味があるのは `unsupported` で、
        iframe を出す前に対応範囲外だと分かる。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteRequest"
            example:
              site_id: 3f1c2a4e-9b7d-4c1e-8a2f-0d6e5b4c3a21
              address: 山形県山形市東青田二丁目7番16号
      responses:
        "200":
          description: 台帳にある（判定済み）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
              example: { id: faff6fb8a9, status: done }
        "202":
          description: 判定が走っている。同じ依頼を何度送っても二重には走らない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccepted"
              example: { id: 1d0219007f, status: processing }
        "400":
          description: 本文が不正（住所が空、`site_id` が uuid でない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Bearer トークンが無いか一致しない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: 認証が必要です }
        "422":
          description: |
            判定を起こせなかった。
            - `unsupported`: 対応範囲外。判定は起こしていない
            - `unresolved`: 住所から位置を特定できなかった、または前面道路を測るには粗かった。判定は起こしていない
            - `failed`: 判定に失敗した（GIS の手元開発で同期判定したときのみ。本番は `processing` で返る）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteRejected"
              example:
                status: unsupported
                error: "この地点の地図データをまだ取り込んでいません。対応範囲: 青森県・岩手県・秋田県・山形県・福岡県の全域"
        "500":
          description: 判定を起動できなかった（Geocoding・Lambda の呼び出しに失敗など）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /embed/{siteId}:
    get:
      tags: [pages]
      operationId: embedSite
      summary: 現場の判定結果を iframe で出す
      description: |
        **HTML を返す画面。** 回収業者の画面に iframe で埋め込む。

        ```html
        <iframe
          src="{BASE}/embed/3f1c2a4e-9b7d-4c1e-8a2f-0d6e5b4c3a21"
          loading="lazy" style="width:100%;border:0"></iframe>
        ```

        `siteId` は `POST /api/sites` に送った `site_id`。URL に署名は付けない
        （uuid は推測できないので、知っている人だけが開ける）。

        | 状況 | 表示 |
        |---|---|
        | 判定済み | 車両別の乗り付け可否・3D モデル・写真・根拠・建物・フィードバック |
        | 判定中 | 「判定中」。終わり次第この枠の中で結果に切り替わる |
        | 判定済みだが地図データの無い地域 | 写真・地図を参考として出す（乗り付け可否は出さない） |
        | 依頼が届いていない・対応範囲外・住所が引けない・判定に失敗・止まった・5 分待っても終わらない | お詫び（どれも同じ文言） |

        再判定・削除など現場を変える操作は出さない。地図のリンクだけは別タブで開く。

        ## 高さ

        中身の高さは変わるので、iframe から親へ `postMessage` で知らせる。
        親は次のように受けて iframe の高さを合わせる。

        ```js
        window.addEventListener("message", (e) => {
          if (e.origin !== GIS_ORIGIN) return;   // 必ず検証する
          if (e.data?.type === "dustalk-gis:height") iframe.style.height = `${e.data.height}px`;
        });
        ```

        ## 埋め込める親

        GIS 側の `GIS_EMBED_ORIGINS` に登録したオリジンだけ。未登録の親からはブラウザが
        表示を拒む。
      security: []
      parameters:
        - name: siteId
          in: path
          required: true
          description: 本体の現場 ID（`emission_site.id`）
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 埋め込み用の画面
          content:
            text/html:
              schema: { type: string }

  /lookup:
    get:
      tags: [pages]
      operationId: lookupAddress
      summary: 住所文字列だけで現場ページを開く（リンク用）
      description: |
        **HTML を返す画面。iframe には入れられない**（`frame-ancestors 'none'`）。
        座標も place_id も持たない連携先が、リンクで GIS の現場ページへ送るための入口。

        ```html
        <a href="{BASE}/lookup?address=北九州市八幡西区黒崎3-15-3">回収可否を見る</a>
        ```

        GIS 側で住所をジオコーディングし、建物単位で1件に決まれば現場ページ
        （`/sites/{id}`）へ移る。決まらなければ候補を出して選ばせる。
        本体との連携では使わない（`/embed` を使う）。GIS の Basic 認証を有効にすると、
        ここは認証ダイアログが出る（人がブラウザで開く前提なので、それで足りる）。
      security: []
      parameters:
        - name: address
          in: query
          required: true
          description: 住所。正規化不要（都道府県や丁目が無くてもよい）
          schema: { type: string }
      responses:
        "200":
          description: 判定中・候補選択・見つからないときの画面
          content:
            text/html:
              schema: { type: string }
        "307":
          description: 判定済みの現場ページへ移る

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        GIS の `INTERNAL_API_TOKEN`（SSM `/gis/prod/INTERNAL_API_TOKEN`）。本体のサーバに
        同じ値を環境変数で持たせる。通るのは `/api/` だけで、GIS の画面は開けない。

  schemas:
    SiteRequest:
      type: object
      required: [site_id, address]
      properties:
        site_id:
          type: string
          format: uuid
          description: 本体の現場 ID（`emission_site.id`）。`/embed/{siteId}` もこれで開く
        address:
          type: string
          description: 入力どおりの住所（都道府県＋市区町村以降）。正規化は GIS がする
        components:
          $ref: "#/components/schemas/RequestLocation"

    RequestLocation:
      type: object
      description: |
        **任意。送らなくてよい。** 本体が abr-geocoder で座標を引いてある場合だけ
        詰める（将来、本体の依頼画面で住所を確かめるようになったとき用）。
        `coordinateLevel` が `residential_detail` か `parcel` なら、GIS は正規化を
        省いてこの座標で判定する。
      properties:
        lat:
          type: number
          description: abr-geocoder の `lat`
        lng:
          type: number
          description: abr-geocoder の `lon`
        coordinateLevel:
          type: string
          description: |
            abr-geocoder の `coordinate_level`。`residential_detail` か `parcel` なら
            GIS はこの座標で判定する
          enum: [unknown, prefecture, city, machiaza, machiaza_detail, residential_block, residential_detail, parcel]
        town:
          type: string
          description: abr-geocoder の `oaza_cho`

    SiteAccepted:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          description: |
            GIS の現場 ID。本体が保存する必要はない（`/embed` は `site_id` で引ける）。
            座標が一致する既存の現場に吸収されると、住所から決まる ID とは別になる
        status:
          type: string
          enum: [done, processing]

    SiteRejected:
      type: object
      required: [status, error]
      properties:
        status:
          type: string
          enum: [unsupported, unresolved, failed]
        id:
          type: string
          description: "`failed` のときだけ"
        error:
          type: string
          description: 理由。利用者にそのまま見せてよい日本語

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 理由。利用者にそのまま見せてよい日本語
